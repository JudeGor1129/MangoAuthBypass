name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos

      - name: Install ldid
        run: brew install ldid

      - name: Build package
        env:
          THEOS: /opt/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangoAuthBypass
          path: packages/*.deb

  # --- 编译完成后自动推送到 Jude 的越狱源 ---
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: JudeGor1129/repo/.github/workflows/publish-deb.yml@main
    with:
      artifact_name: MangoAuthBypass
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
