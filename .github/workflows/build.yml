name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos

      - name: Build package
        env:
          THEOS: /opt/theos
        run: make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangoAuthBypass
          path: packages/*.deb
